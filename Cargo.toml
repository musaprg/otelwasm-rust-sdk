[workspace]
members = [
    "crates/otelwasm-rust-sdk",
    "examples/traces-processor-guest",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
once_cell = "1.20.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
